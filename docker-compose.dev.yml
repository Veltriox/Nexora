name: nexora

services:
  backend:
    image: nexora-backend
    build: ./backend
    container_name: nexora-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./deployments:/deployments
      - ./nginx-proxy/conf.d:/nginx-conf
      - ./nginx-proxy/certbot/conf:/etc/letsencrypt
      - ./backups:/data/backups
    environment:
      - DEPLOYMENTS_PATH=/deployments
      - NGINX_CONF_PATH=/nginx-conf
      - DOCKER_NETWORK=nexora_network
      - BACKUP_PATH=/data/backups
      - DATA_PATH=/app/data
      - CERTBOT_STAGING=${CERTBOT_STAGING:-true}
      - LETSENCRYPT_PATH=/etc/letsencrypt
      - CERTBOT_CONTAINER=nexora-certbot
    networks:
      - nexora_network

  nginx-proxy:
    image: nginx:stable-alpine
    container_name: nexora-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy/conf.d:/etc/nginx/conf.d:ro
      - ./nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-proxy/snippets:/etc/nginx/snippets:ro
      - ./nginx-proxy/certbot/www:/var/www/certbot:ro
      - ./nginx-proxy/certbot/conf:/etc/letsencrypt:ro
    networks:
      - nexora_network
    depends_on:
      - certbot

  certbot:
    image: certbot/certbot
    container_name: nexora-certbot
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          echo "[certbot] $(date -u +%Y-%m-%dT%H:%M:%SZ) checking renewals"
          certbot renew --webroot -w /var/www/certbot || true
          sleep 12h
        done
    volumes:
      - ./nginx-proxy/certbot/www:/var/www/certbot
      - ./nginx-proxy/certbot/conf:/etc/letsencrypt
    networks:
      - nexora_network

networks:
  nexora_network:
    name: nexora_network
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd12:3456:789a::/64
